world:
  world_height: 10
  world_width: 10
  step_time: 0.1

robots:
  robot_mode: 'diff'
  robot_init_mode: 7  # Mode 7: random with distance constraint + random polygons
  robot_number: 10
  max_start_goal_distance: 5.0
  radius_list: [0.2, 0.2]
  vel_max: [1.5, 1.5]
  radius_exp: 0.1
  interval: 1
  square: [0, 0, 10, 10]
  random_bear: True

# Stage 4: 复杂随机多边形障碍物 - 课程学习第三阶段
obs_polygons_random:
  enable: True
  obs_num_range: [4, 6]           # 4-6个障碍物，最多数量
  generation_area: [1, 1, 9, 9]   # 完整生成区域
  polygon_size_range: [1.0, 1.6]  # 大尺寸多边形
  vertex_num_range: [4, 6]        # 4-6边形，复杂形状
  min_obstacle_distance: 0.8      # 标准障碍物间距离
  min_agent_distance: 0.6         # 标准安全距离
  obstacle_density: 0.75          # 高密度
  irregularity: 0.4               # 高不规则度
  max_attempts: 500               # 生成尝试次数
