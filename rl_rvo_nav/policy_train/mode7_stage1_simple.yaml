world:
  world_height: 10
  world_width: 10
  step_time: 0.1

robots:
  robot_mode: 'diff'
  robot_init_mode: 7  # Mode 7: random with distance constraint + random polygons
  robot_number: 4
  max_start_goal_distance: 5.0
  radius_list: [0.2, 0.2]
  vel_max: [1.5, 1.5]
  radius_exp: 0.1
  interval: 1
  square: [0, 0, 10, 10]
  random_bear: True

# Stage 1: 简单随机多边形障碍物 - 课程学习第一阶段
obs_polygons_random:
  enable: True
  obs_num_range: [1, 2]           # 1-2个障碍物，较少
  generation_area: [2, 2, 8, 8]   # 较小的生成区域，避免边界复杂性
  polygon_size_range: [0.6, 1.0]  # 小尺寸多边形
  vertex_num_range: [3, 4]        # 只有三角形和四边形，简单形状
  min_obstacle_distance: 2.0      # 障碍物间较大距离
  min_agent_distance: 1.0         # agent到障碍物较大安全距离
  obstacle_density: 0.06          # 低密度
  irregularity: 0.2               # 低不规则度，接近规则形状
  max_attempts: 100               # 生成尝试次数
